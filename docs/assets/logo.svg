<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" role="img" aria-label="Estandarte de La Lanza de Plata" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="tela" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a2452"/>
      <stop offset=".5" stop-color="#26357a"/>
      <stop offset="1" stop-color="#1a2452"/>
    </linearGradient>
    <linearGradient id="plata" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa3b3"/>
      <stop offset=".45" stop-color="#f3f5f9"/>
      <stop offset="1" stop-color="#aab2c0"/>
    </linearGradient>
    <radialGradient id="luz" cx="60" cy="50" r="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe2a0" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#f4b942" stop-opacity=".35"/>
      <stop offset="1" stop-color="#f4b942" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- asta horizontal -->
  <rect x="6" y="8" width="108" height="6" rx="3" fill="#d9b25c"/>
  <circle cx="6" cy="11" r="5" fill="#d9b25c"/><circle cx="114" cy="11" r="5" fill="#d9b25c"/>

  <!-- estandarte con cola en V -->
  <path d="M16 14 H104 V140 L60 118 L16 140 Z" fill="url(#tela)" stroke="#d9b25c" stroke-width="3" stroke-linejoin="round"/>
  <path d="M23 20 H97 V129 L60 110.5 L23 129 Z" fill="none" stroke="#d9b25c" stroke-opacity=".45" stroke-width="1.2"/>

  <!-- la luz del Faro -->
  <circle cx="60" cy="50" r="34" fill="url(#luz)"/>
  <g stroke="#f4cf7a" stroke-width="1.4" stroke-linecap="round" opacity=".85">
    <line x1="60" y1="22" x2="60" y2="30"/><line x1="60" y1="70" x2="60" y2="78"/>
    <line x1="32" y1="50" x2="40" y2="50"/><line x1="80" y1="50" x2="88" y2="50"/>
    <line x1="40.2" y1="30.2" x2="45.9" y2="35.9"/><line x1="74.1" y1="64.1" x2="79.8" y2="69.8"/>
    <line x1="79.8" y1="30.2" x2="74.1" y2="35.9"/><line x1="45.9" y1="64.1" x2="40.2" y2="69.8"/>
  </g>

  <!-- la lanza -->
  <rect x="58.2" y="56" width="3.6" height="58" rx="1.2" fill="url(#plata)"/>
  <path d="M60 28 L67 52 L62.6 50 L61.6 58 H58.4 L57.4 50 L53 52 Z" fill="url(#plata)" stroke="#6f7787" stroke-width=".6"/>
  <path d="M60 31 V55" stroke="#8a93a3" stroke-width=".7"/>
  <rect x="53" y="58" width="14" height="3" rx="1" fill="#d9b25c"/>
  <path d="M60 114 L63.5 120 L60 124 L56.5 120 Z" fill="#d9b25c"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
